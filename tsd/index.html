<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тестовый билд — камера, кнопка и звук</title>
  <style>
    :root {
      --bg: #121417;
      --card: #1c2026;
      --text: #eef1f4;
      --muted: #9aa4b2;
      --ok: #2ea043;
      --err: #d9534f;
      --active: #2f81f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
    }

    .panel {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .status-box {
      padding: 11px 14px;
      border-radius: 10px;
      background: #14181d;
      border: 1px solid #2b313a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #2b313a;
      color: var(--text);
      white-space: nowrap;
    }

    .badge.ok { background: rgba(46, 160, 67, 0.2); color: #56d364; }
    .badge.err { background: rgba(217, 83, 79, 0.2); color: #ff7b72; }
    .badge.run { background: rgba(47, 129, 247, 0.2); color: #79c0ff; }

    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #0d1014;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2b313a;
      display: grid;
      place-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    video.active {
      display: block;
    }

    .placeholder {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 16px;
    }

    .scan-btn {
      width: 100%;
      min-height: 82px;
      border: 0;
      border-radius: 14px;
      background: var(--active);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      transition: transform 0.08s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .scan-btn.active {
      background: #c93c37;
    }

    .scan-btn:active {
      transform: scale(0.98);
    }

    .scan-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .test-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mini-btn {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2f3640;
      background: #222730;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .hint {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="status-box">
      <span id="statusText">Камера выключена</span>
      <span id="statusBadge" class="badge">ОЖИДАНИЕ</span>
    </div>

    <div class="viewport">
      <video id="video" playsinline muted></video>
      <div id="placeholder" class="placeholder">Нажмите «СКАНИРОВАТЬ», чтобы запустить камеру</div>
    </div>

    <button id="scanBtn" class="scan-btn" type="button">
      СКАНИРОВАТЬ
    </button>

    <div class="test-row">
      <button id="testOkBtn" class="mini-btn" type="button">Звук: успех</button>
      <button id="testErrBtn" class="mini-btn" type="button">Звук: ошибка</button>
    </div>

    <p class="hint">
      Повторное нажатие останавливает камеру и освобождает треки. Для доступа к камере требуется HTTPS (например, GitHub Pages) или localhost.
    </p>
  </main>

  <script>
    const COOLDOWN_MS = 450;
    let lastTriggerAt = 0;
    let audioCtx = null;
    let currentStream = null;
    let isCameraRunning = false;

    const video = document.getElementById('video');
    const placeholder = document.getElementById('placeholder');
    const scanBtn = document.getElementById('scanBtn');
    const testOkBtn = document.getElementById('testOkBtn');
    const testErrBtn = document.getElementById('testErrBtn');
    const statusText = document.getElementById('statusText');
    const statusBadge = document.getElementById('statusBadge');

    function getAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playSoftTone({ freqStart, freqEnd, duration, peakGain = 0.075, type = 'sine' }) {
      const ctx = getAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freqStart, now);
      if (freqEnd !== freqStart) {
        osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);
      }

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(peakGain, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function soundSuccess() {
      playSoftTone({ freqStart: 523.25, freqEnd: 659.25, duration: 0.14, peakGain: 0.075, type: 'sine' });
    }

    function soundError() {
      playSoftTone({ freqStart: 310, freqEnd: 235, duration: 0.18, peakGain: 0.08, type: 'triangle' });
    }

    function setState(text, mode) {
      statusText.textContent = text;
      statusBadge.className = 'badge';

      if (mode === 'ok') {
        statusBadge.textContent = 'УСПЕХ';
        statusBadge.classList.add('ok');
      } else if (mode === 'err') {
        statusBadge.textContent = 'ОШИБКА';
        statusBadge.classList.add('err');
      } else if (mode === 'run') {
        statusBadge.textContent = 'КАМЕРА ВКЛ';
        statusBadge.classList.add('run');
      } else {
        statusBadge.textContent = 'ОЖИДАНИЕ';
      }
    }

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setState('Браузер не поддерживает камеру или нет HTTPS', 'err');
        soundError();
        return;
      }

      scanBtn.disabled = true;
      setState('Запрос доступа к камере...', 'run');

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = currentStream;
        await video.play();

        video.classList.add('active');
        placeholder.style.display = 'none';
        isCameraRunning = true;

        scanBtn.textContent = 'ОСТАНОВИТЬ КАМЕРУ';
        scanBtn.classList.add('active');
        setState('Камера активна', 'run');
        soundSuccess();
      } catch (err) {
        console.error(err);
        setState('Ошибка запуска: ' + (err.name || 'нет доступа'), 'err');
        soundError();
      } finally {
        scanBtn.disabled = false;
      }
    }

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }

      video.pause();
      video.srcObject = null;
      video.classList.remove('active');
      placeholder.style.display = 'block';
      isCameraRunning = false;

      scanBtn.textContent = 'СКАНИРОВАТЬ';
      scanBtn.classList.remove('active');
      setState('Камера выключена', 'idle');
    }

    async function handleToggleCamera() {
      const now = Date.now();
      if (now - lastTriggerAt < COOLDOWN_MS) return;
      lastTriggerAt = now;

      if (isCameraRunning) {
        stopCamera();
      } else {
        await startCamera();
      }
    }

    scanBtn.addEventListener('click', handleToggleCamera);

    testOkBtn.addEventListener('click', () => {
      soundSuccess();
      if (!isCameraRunning) setState('Тест мягкого звука успеха', 'ok');
    });

    testErrBtn.addEventListener('click', () => {
      soundError();
      if (!isCameraRunning) setState('Тест мягкого звука ошибки', 'err');
    });

    // Автоматически гасим камеру при сворачивании вкладки
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isCameraRunning) {
        stopCamera();
      }
    });
  </script>
</body>
</html>
