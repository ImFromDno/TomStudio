<body>

      <span class="ts-project">Project Base</span>
    </div>
  </header>

  <div class="card">
    <div class="controls-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по названию товара или GTIN..." autofocus>
      </div>
      <div class="action-group">
        <select id="dbSelect" onchange="changeDatabase(this.value)" title="Выбор компании">
          <option value="belsvet" selected>Белсвет</option>
          <option value="energodar">Энергодар</option>
        </select>
        <button type="button" class="refresh-btn" onclick="loadData()" aria-label="Обновить базу" title="Обновить базу">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>
    </div>
    <div class="options-row">
      <label class="checkbox-label" for="leadingZeroCheckbox" title="Добавить или убрать ноль в начале GTIN">
        <input type="checkbox" id="leadingZeroCheckbox">
        <span>Ноль перед GTIN (<code>0</code> + GTIN)</span>
      </label>
      <div class="cz-notice">
        Нет товара в списке? Сразу пишите вашему менеджеру — модерация товара в ЧЗ может занимать до суток!!!
      </div>
    </div>
  </div>

  <div id="statsBar" class="stats-bar">
    <span id="counter">Загрузка базы...</span>
    <span id="lastUpdate"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width: 230px;">GTIN</th>
          <th>Полное наименование товара</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="2" class="empty-state">Загружаем данные из Google Таблицы...</td></tr>
      </tbody>
    </table>
  </div>

  <footer class="page-footer">
    <div class="ts-bar" aria-label="Tom Studio — Project Base">
      <span class="ts-brand">Tom Studio</span>
      <span class="ts-divider" aria-hidden="true"></span>
      <span class="ts-project">Project Base</span>
    </div>
  </footer>

  <div id="toast" class="toast">GTIN скопирован!</div>

  <script>
    const DATABASES = {
      'belsvet': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTF_e2qsgUoRP_k6TZp0iP4Ybvy8yhVpr6JPHqmO0LpSFsvj0vIqLTLWdb8j_3dqWcdxdas0h8JhHMY/pub?gid=0&single=true&output=csv',
      'energodar': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTF_e2qsgUoRP_k6TZp0iP4Ybvy8yhVpr6JPHqmO0LpSFsvj0vIqLTLWdb8j_3dqWcdxdas0h8JhHMY/pub?gid=21252746&single=true&output=csv'
    };

    let currentDbKey = 'belsvet';
    let products = [];

    const bulbToggleEl = document.getElementById("bulbToggle");
    const leadingZeroCheckboxEl = document.getElementById("leadingZeroCheckbox");

    function formatGtin(rawGtin, withLeadingZero) {
      const cleaned = String(rawGtin ?? '').trim();
      if (!cleaned) return '';
      if (withLeadingZero) {
        return cleaned.startsWith('0') ? cleaned : '0' + cleaned;
      }
      return cleaned.replace(/^0+/, '');
    }

    function isEffectiveDarkTheme() {
      const explicit = document.documentElement.getAttribute("data-theme");
      if (explicit === "dark") return true;
      if (explicit === "light") return false;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    }

    function syncBulbButton() {
      const dark = isEffectiveDarkTheme();
      bulbToggleEl.classList.toggle("is-lit", !dark);
      bulbToggleEl.classList.toggle("is-off", dark);
      bulbToggleEl.title = dark ? "Тёмная тема (лампочка потухла) — включить свет" : "Светлая тема (лампочка горит) — выключить свет";
    }

    bulbToggleEl.addEventListener("click", () => {
      const nextDark = !isEffectiveDarkTheme();
      document.documentElement.setAttribute("data-theme", nextDark ? "dark" : "light");
      syncBulbButton();
    });

    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (!document.documentElement.getAttribute("data-theme")) {
          syncBulbButton();
        }
      });
    }

    syncBulbButton();

    const iconCopy = `<svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
    const iconCheck = `<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>`;

    function changeDatabase(key) {
      currentDbKey = key;
      loadData();
    }

    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          currentRow.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentVal.trim());
          if (currentRow.some(cell => cell !== '')) rows.push(currentRow);
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal !== '' || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        if (currentRow.some(cell => cell !== '')) rows.push(currentRow);
      }
      return rows;
    }

    async function loadData() {
      const tbody = document.getElementById('tableBody');
      const counter = document.getElementById('counter');
      const statsBar = document.getElementById('statsBar');
      const csvUrl = DATABASES[currentDbKey];

      try {
        statsBar.className = 'stats-bar';
        counter.textContent = 'Загрузка базы...';
        const cacheBuster = (csvUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
        const response = await fetch(csvUrl + cacheBuster);
        if (!response.ok) throw new Error('Ошибка сети: ' + response.status);

        const csvText = await response.text();
        const rows = parseCSV(csvText);

        products = rows.slice(1).map(row => ({
          gtin: row[0] || '',
          name: row[1] || ''
        })).filter(item => item.gtin || item.name);

        const now = new Date();
        document.getElementById('lastUpdate').textContent =
          `Обновлено в ${now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'})}`;

        renderTable();
      } catch (err) {
        statsBar.className = 'stats-bar warn';
        tbody.innerHTML = `<tr><td colspan="2" class="empty-state">Ошибка загрузки таблицы: ${escapeHtml(err.message)}. Проверь настройки публикации листа.</td></tr>`;
        counter.textContent = 'Ошибка';
      }
    }

    function renderTable() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const tbody = document.getElementById('tableBody');
      const counter = document.getElementById('counter');
      const withLeadingZero = Boolean(leadingZeroCheckboxEl && leadingZeroCheckboxEl.checked);

      const searchTerms = query.split(/\s+/).filter(Boolean);

      const formattedProducts = products.map(item => ({
        ...item,
        displayGtin: formatGtin(item.gtin, withLeadingZero)
      }));

      const filtered = formattedProducts.filter(item => {
        if (searchTerms.length === 0) return true;
        const haystack = `${item.gtin} ${item.displayGtin} ${item.name}`.toLowerCase();
        return searchTerms.every(term => haystack.includes(term));
      });

      counter.textContent = `Найдено позиций: ${filtered.length} из ${products.length}`;

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" class="empty-state">Ничего не найдено по вашему запросу</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(item => `
        <tr>
          <td>
            <div class="gtin-cell">
              <span>${escapeHtml(item.displayGtin)}</span>
              <button type="button" class="copy-btn" onclick="copyGtin('${escapeHtml(item.displayGtin)}', this)" title="Копировать GTIN">
                ${iconCopy}
              </button>
            </div>
          </td>
          <td>${escapeHtml(item.name)}</td>
        </tr>
      `).join('');
    }

    function copyGtin(gtin, btn) {
      navigator.clipboard.writeText(gtin).then(() => {
        btn.innerHTML = iconCheck;
        btn.classList.add('copied');

        const toast = document.getElementById('toast');
        toast.textContent = `Скопирован GTIN: ${gtin}`;
        toast.classList.add('show');

        setTimeout(() => {
          btn.innerHTML = iconCopy;
          btn.classList.remove('copied');
          toast.classList.remove('show');
        }, 1500);
      });
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    document.getElementById('searchInput').addEventListener('input', renderTable);
    leadingZeroCheckboxEl.addEventListener('change', renderTable);

    loadData();
  </script>
</body>
</html>
